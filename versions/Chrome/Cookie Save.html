<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cookie Save</title>
  <style>
    :root {
      --bg: #1c120a;
      --card: #2e1f14;
      --accent: #eb9438;
      --ink: #1c120a;
      --text: #f3e6d4;
      --muted: #c4aa90;
      --line: rgba(243, 230, 212, 0.14);
      --rise: #66d17a;
      --fall: #db6b52;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text); }
    body { font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    #shell { display: flex; min-width: 860px; height: 100%; min-height: 560px; }
    aside {
      width: 188px; flex: none; display: flex; flex-direction: column;
      background: #140d08; border-right: 1px solid var(--line);
    }
    aside h1 { font-size: 15px; margin: 0; padding: 16px 14px 8px; }
    #nav { overflow: auto; padding: 0 8px 12px; display: flex; flex-direction: column; gap: 4px; }
    #nav button {
      text-align: left; background: transparent; color: var(--text);
      border: 0; border-radius: 8px; padding: 8px 10px; cursor: pointer; font: inherit;
    }
    #nav button.on { background: var(--accent); color: var(--ink); font-weight: 650; }
    main { flex: 1; overflow: auto; padding: 20px 22px 36px; }
    h2 { margin: 0 0 6px; font-size: 22px; font-weight: 650; }
    .detail { color: var(--muted); margin: 0 0 16px; }
    #status { min-height: 1.3em; margin: 0 0 12px; color: var(--accent); }
    .card { background: var(--card); border-radius: 8px; padding: 12px; margin: 0 0 12px; }
    .card h3 { margin: 0 0 6px; font-size: 16px; }
    .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .building { padding: 10px 0; border-bottom: 1px solid var(--line); }
    button.act, button.choice {
      border: 0; border-radius: 8px; padding: 7px 12px; cursor: pointer; font: inherit;
    }
    button.act { background: var(--accent); color: var(--ink); font-weight: 650; }
    button.choice { background: #3a2818; color: var(--text); }
    button.choice.on { background: var(--accent); color: var(--ink); font-weight: 650; }
    input, select, textarea {
      background: #120c08; color: var(--text); border: 1px solid #5a3d28;
      border-radius: 8px; padding: 7px 8px; font: inherit;
    }
    textarea { width: 100%; min-height: 150px; resize: vertical; }
    .mono, .formula, #exportBox, #paste {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    .formula { white-space: pre-wrap; margin: 8px 0 0; }
    .muted { color: var(--muted); }
    .rise { color: var(--rise); }
    .fall { color: var(--fall); }
    .item { margin: 0 0 6px; }
    label.file {
      display: inline-block; background: #3a2818; color: var(--text);
      border-radius: 8px; padding: 7px 12px; cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="shell">
    <aside>
      <h1>Cookie Save</h1>
      <nav id="nav"></nav>
    </aside>
    <main>
      <p id="status"></p>
      <div id="page"></div>
    </main>
  </div>
  <script src="catalog.js"></script>
  <script src="save-core.js"></script>
  <script src="app.js"></script>
</body>
</html>
